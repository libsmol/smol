[workspace]
members = ["crates/libsmol", "crates/reaper", "crates/smol"]
exclude = ["crates/worker"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/libsmol/smol"
version = "0.1.1"

[workspace.dependencies]
reaper = { package = "libsmol-reaper", version = "0.1.1", path = "crates/reaper" }

# Test workers run the RustPython built here, which is far too slow unoptimized
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

# These compile the guest on first start, which takes twice as long when they are built for size
[profile.release.package]
cranelift-assembler-x64 = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-bitset = { opt-level = 3 }
cranelift-codegen = { opt-level = 3 }
cranelift-control = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmparser = { opt-level = 3 }
wasmtime = { opt-level = 3 }
wasmtime-environ = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }
