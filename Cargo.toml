[workspace]
members = ["crates/libsmol", "crates/reaper", "crates/smol", "crates/worker"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/libsmol/smol"
version = "0.9.0"

[workspace.dependencies]
reaper = { package = "libsmol-reaper", path = "crates/reaper" }
worker = { package = "libsmol-worker", path = "crates/worker" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
