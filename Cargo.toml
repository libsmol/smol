[workspace]
members = ["crates/libsmol", "crates/reaper", "crates/smol", "crates/worker"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/libsmol/smol"
version = "0.6.8"

[workspace.dependencies]
libsmol = { version = "0.6.8", path = "crates/libsmol" }
reaper = { package = "libsmol-reaper", version = "0.6.8", path = "crates/reaper" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
