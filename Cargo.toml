[workspace]
members = ["crates/libsmol", "crates/reaper", "crates/smol"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Test workers run the RustPython built here, which is far too slow unoptimized
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
