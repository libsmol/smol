[workspace]
members = ["crates/libsmol", "crates/reaper", "crates/smol"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/libsmol/smol"
version = "0.4.1"

[workspace.dependencies]
reaper = { package = "libsmol-reaper", version = "0.4.1", path = "crates/reaper" }

# Test workers run the RustPython built here, which is far too slow unoptimized
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
