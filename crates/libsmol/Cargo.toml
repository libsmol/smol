[package]
name = "libsmol"
description = "A CodeMode ACP agent that works by writing Python through a single eval tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "acp", "mcp", "python"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "libsmol"
path = "src/main.rs"

[dependencies]
agent-client-protocol-schema = { version = "1", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = [
    "alloc",
    "now",
] }
encoding_rs = "0.8"
flate2 = "1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
html5ever = "0.39"
ignore = "0.4"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
reaper.workspace = true
regex-syntax = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3", features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "chrono",
    "env-filter",
    "fmt",
    "std",
    "tracing-log",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
