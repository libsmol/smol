[package]
name = "libsmol-worker"
description = "CPython linked statically, with its standard library served from memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Hands libsmol's build script the link arguments that only a binary can take
links = "worker"

[lib]
name = "worker"
test = false
doctest = false

[build-dependencies]
ar = "0.9"
cc = "1"
ruzstd = "0.8"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = "3"

[dependencies]
libc = "0.2"
pyo3 = "0.30"
reaper.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
] }

# The libraries pbs builds only as DLLs on Windows, linked statically for the extension modules
# that need them, with SQLite shared with rusqlite's
[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
libffi-sys = "4.2"
libsqlite3-sys = { version = "0.39", features = ["bundled"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
