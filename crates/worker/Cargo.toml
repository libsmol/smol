[package]
name = "libsmol-worker"
description = "CPython linked statically, with its standard library served from memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Hands libsmol's build script the link arguments that only a binary can take
links = "smolpython"

[lib]
name = "worker"

[build-dependencies]
ar = "0.9"
flate2 = "1"
ruzstd = "0.8"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = "3"

[dependencies]
libc = "0.2"
pyo3 = "0.30"
