[package]
name = "libsmol-tui"
description = "smol, the terminal client for libsmol and other ACP agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "acp", "tui", "terminal"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
agent-client-protocol-schema = { version = "1", default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ignore = "0.4"
mmdflux = { version = "2.6.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-textarea = "0.9"
reaper.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[[bin]]
name = "smol"
path = "src/main.rs"
