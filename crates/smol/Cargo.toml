[package]
name = "libsmol-tui"
description = "smol, the terminal and web client for libsmol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "../../README.md"
keywords = ["agent", "llm", "acp", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
agent-client-protocol-schema = { version = "1", default-features = false }
anyhow = "1"
arboard = "3.7"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
getrandom = "0.3"
httparse = "1"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mmdflux = { version = "2.6.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-textarea = "0.9"
reaper.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textwrap = "0.16"
tungstenite = "0.28"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[[bin]]
name = "smol"
path = "src/main.rs"
