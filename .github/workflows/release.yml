name: Release

on:
  push:
    tags: ["v*"]
  # Builds and checks every target without publishing
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      # Tests only run debug builds of the host's target, and a module that fails to load opens no session
      - name: Load the worker module
        shell: bash
        run: |
          source=crates/libsmol/src/worker/python.rs
          release=$(sed -n 's/^const RELEASE: &str = "\(.*\)";$/\1/p' $source)
          python=$(sed -n 's/^pub(crate) const PYTHON: &str = "\(.*\)";$/\1/p' $source)
          sha=$(awk -v target='"${{ matrix.target }}",' '$1 == target { getline; gsub(/[ ",]/, ""); print }' $source)
          case "${{ matrix.target }}" in
            *windows*) interpreter=python/python.exe module=_smol.dll ;;
            *apple*) interpreter=python/bin/python module=lib_smol.dylib ;;
            *) interpreter=python/bin/python module=lib_smol.so ;;
          esac
          # The Intel runtime runs on the Apple silicon runner through Rosetta
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          module="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/$module"

          # Relative names keep Windows drive letters away from tar, which would take them for hosts
          cd "$RUNNER_TEMP"
          name=cpython-$python+$release-${{ matrix.target }}-install_only_stripped.tar.gz
          curl -fsSL -o "$name" "https://github.com/astral-sh/python-build-standalone/releases/download/$release/$name"
          sum=sha256sum
          command -v sha256sum >/dev/null || sum="shasum -a 256"
          echo "$sha  $name" | $sum -c -
          tar -xzf "$name"
          "$interpreter" -I - "$module" <<'EOF'
          import sys
          from importlib.machinery import ExtensionFileLoader
          from importlib.util import module_from_spec, spec_from_loader
          loader = ExtensionFileLoader("_smol", sys.argv[1])
          module = module_from_spec(spec_from_loader("_smol", loader))
          loader.exec_module(module)
          print(sys.version, module.serve, module.repair)
          EOF

      # The install scripts download these unversioned names from latest
      - name: Package
        shell: bash
        run: |
          name=smol-${{ matrix.target }}
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=.exe ;; esac
          mkdir -p "dist/$name"
          for program in smol libsmol; do
            cp "target/${{ matrix.target }}/release/$program$suffix" "dist/$name/"
          done
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.html "dist/$name/"
          # libsmol downloads its worker module from the release of its version on first use
          case "${{ matrix.target }}" in
            *windows*) module=_smol.dll ;;
            *apple*) module=lib_smol.dylib ;;
            *) module=lib_smol.so ;;
          esac
          cp "target/${{ matrix.target }}/release/$module" "dist/smol-worker-${{ matrix.target }}"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a "$name.zip" "$name" ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "${name:?}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # libsmol downloads the worker module of its own target, which it knows from python.rs
      - name: Check worker modules
        run: |
          builds=$(sed -n 's/^ *"\([a-z0-9_]*-[a-z0-9_-]*\)",$/\1/p' crates/libsmol/src/worker/python.rs | sort)
          shipped=$(ls dist | sed -n 's/^smol-worker-//p' | sort)
          if [ -z "$builds" ] || [ "$builds" != "$shipped" ]; then
            echo "runtimes in python.rs:" $builds
            echo "worker modules built:" $shipped
            exit 1
          fi
      - name: Checksums
        run: |
          cd dist
          sha256sum smol-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md]($changelog)." \
            --verify-tag
