name: Release

on:
  push:
    tags: ["v*"]
  # Builds and checks every target without publishing
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The Intel build runs on the Apple silicon runner through Rosetta, also the python that
      # crates/worker compiles the stdlib with
      - name: Install Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      # Tests only run debug builds of the host's target, so each release build is checked as the
      # python the code gets: the stdlib, a venv with pip, and a wheel's C extension
      - name: Check the embedded Python
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) built=libsmol.exe python=python.exe scripts=Scripts ;;
            *) built=libsmol python=python3 scripts=bin ;;
          esac
          # Started under another name, libsmol runs as python
          check="$RUNNER_TEMP/check"
          mkdir -p "$check"
          cp "target/${{ matrix.target }}/release/$built" "$check/$python"
          "$check/$python" -I -c "import ctypes, decimal, json, lzma, sqlite3, ssl, zlib; print(ssl.OPENSSL_VERSION, sqlite3.sqlite_version)"
          "$check/$python" -m venv "$check/venv"
          "$check/venv/$scripts/python" -m pip install --only-binary :all: markupsafe
          "$check/venv/$scripts/python" -c "import importlib.metadata, markupsafe._speedups, sys; print(sys.version, importlib.metadata.version('markupsafe'))"

      # The install scripts download these unversioned names from latest
      - name: Package
        shell: bash
        run: |
          name=smol-${{ matrix.target }}
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=.exe ;; esac
          mkdir -p "dist/$name"
          for program in smol libsmol; do
            cp "target/${{ matrix.target }}/release/$program$suffix" "dist/$name/"
          done
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.html "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a "$name.zip" "$name" ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "${name:?}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Every target that crates/worker has a CPython for ships, and no other
      - name: Check targets
        run: |
          builds=$(sed -n 's/^ *"\([a-z0-9_]*-[a-z0-9_-]*\)",$/\1/p' crates/worker/build.rs | sort)
          shipped=$(ls dist | sed -n 's/^smol-\(.*\)\.\(tar\.gz\|zip\)$/\1/p' | sort)
          if [ -z "$builds" ] || [ "$builds" != "$shipped" ]; then
            echo "builds in crates/worker/build.rs:" $builds
            echo "archives built:" $shipped
            exit 1
          fi
      - name: Checksums
        run: |
          cd dist
          sha256sum smol-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md]($changelog)." \
            --verify-tag
