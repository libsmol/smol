name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The guest is the same file on every system, so it is built once
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./build.sh worker
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo about generate --manifest-path crates/worker/Cargo.toml -c about.toml about-python.hbs -o THIRD-PARTY-LICENSES-PYTHON.html
      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: |
            target/worker/wasm32-wasip2/release/libsmol_worker.wasm
            THIRD-PARTY-LICENSES-PYTHON.html
          if-no-files-found: error

  build:
    needs: worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      # Unpacks into the paths the worker job uploaded from
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: .

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html

      # The install scripts download these unversioned names from latest
      - name: Package
        shell: bash
        run: |
          name=smol-${{ matrix.target }}
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=.exe ;; esac
          mkdir -p "dist/$name"
          for program in smol libsmol; do
            cp "target/${{ matrix.target }}/release/$program$suffix" "dist/$name/"
          done
          cp README.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.html THIRD-PARTY-LICENSES-PYTHON.html "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a "$name.zip" "$name" ;;
            *) tar -czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum smol-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md]($changelog)." \
            --verify-tag
