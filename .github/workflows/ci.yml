name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    needs: worker
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # libsmol embeds the guest, which is the same file on every system
      - uses: actions/download-artifact@v4
        with:
          name: worker
          path: target/worker/wasm32-wasip2/release
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Failed runs save the build too, or the next run compiles everything from scratch
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The tests' MCP server is a Python script, run as python on Windows and python3 elsewhere
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  # rustup installs the worker's toolchain from its rust-toolchain.toml
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/worker
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/worker -> ../../target/worker
          cache-on-failure: true
      - run: cargo fmt --check
      # build.sh builds without --locked and would quietly update a stale lock file
      - run: cargo fetch --locked
      # Also downloads the wasi-libc that clippy needs to build the C dependencies
      - run: ../../build.sh worker
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: target/worker/wasm32-wasip2/release/libsmol_worker.wasm
          if-no-files-found: error
