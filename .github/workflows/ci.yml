name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The CPython crates/worker links, which its build script downloads into target/pbs
      - uses: actions/cache@v4
        with:
          path: target/pbs
          key: pbs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/worker/build.rs') }}
      # Failed runs save the build too, or the next run compiles everything from scratch
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The static OpenSSL builds with a native Perl, and Git's on PATH lacks modules it uses
      - if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
